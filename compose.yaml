services:
  booking-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: haven-pine-booking-api
    environment:
      DEMO_MEMBER_PASSWORD: ${DEMO_MEMBER_PASSWORD:-pine-circle-2026}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  booking-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haven-pine-booking-demo
    ports:
      - "8080:8080"
    depends_on:
      booking-api:
        condition: service_healthy
    restart: unless-stopped
